[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "db-lens-tui"
version = "0.2.0"
description = "A small read-only terminal database browser"
requires-python = ">=3.10"
dependencies = ["textual>=1,<7"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4", "sqlglot>=26,<30"]
mysql = ["PyMySQL[rsa]>=1.1,<2", "sqlglot>=26,<30"]
redis = ["redis>=5,<9"]
all = ["psycopg[binary]>=3.2,<4", "PyMySQL[rsa]>=1.1,<2", "sqlglot>=26,<30", "redis>=5,<9"]
test = ["fakeredis>=2,<3"]

[project.scripts]
db-lens = "db_lens.app:main"

[tool.setuptools.packages.find]
include = ["db_lens*"]
